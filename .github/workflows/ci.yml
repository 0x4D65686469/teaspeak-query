name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows (VS2022, ClangCL, ${{ matrix.config }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build `
                -G "Visual Studio 17 2022" -A x64 -T ClangCL `
                -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-windows-${{ matrix.config }}
          path: build/examples/${{ matrix.config }}/tq_basic.exe
          if-no-files-found: error

  build-linux:
    name: Linux (clang, Ninja, ${{ matrix.config }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ci-linux-${{ matrix.config }}
          path: build/examples/tq_basic
          if-no-files-found: error

  build-linux-gcc:
    name: Linux (GCC, Ninja, Release)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ cmake ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_C_COMPILER=gcc \
                -DCMAKE_CXX_COMPILER=g++ \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  build-sanitizers:
    name: Linux (clang, ASan+UBSan)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld cmake ninja-build

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Debug \
                -DTQ_USE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

  install-test:
    name: Install & find_package smoke test
    runs-on: ubuntu-22.04
    needs: [build-linux]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build

      - name: Build and install library
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Release \
                -DTQ_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/_install"

      - name: Build a downstream consumer
        run: |
          mkdir -p _consumer
          cat > _consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(consumer LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          find_package(teaspeak_query REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE teaspeak_query::teaspeak_query)
          EOF

          cat > _consumer/main.cpp <<'EOF'
          #include <teaspeak_query/teaspeak_query.hpp>
          int main() {
              teaspeak_query::ServerQuery q("127.0.0.1", 10101);
              return q.connected() ? 0 : 1;
          }
          EOF

          cmake -S _consumer -B _consumer/build -G Ninja \
                -DCMAKE_C_COMPILER=clang \
                -DCMAKE_CXX_COMPILER=clang++ \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH="$PWD/_install"
          cmake --build _consumer/build --parallel

  ci-success:
    name: CI success
    if: always()
    needs:
      - build-windows
      - build-linux
      - build-linux-gcc
      - build-sanitizers
      - install-test
    runs-on: ubuntu-22.04
    steps:
      - name: Check all jobs
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results" | grep -q '"result": *"failure"' && exit 1
          echo "All CI jobs passed."